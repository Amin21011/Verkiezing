version: "3.8"

services:
  db:
    image: postgres:16
    container_name: election-postgres
    restart: always
    environment:
      POSTGRES_DB: electiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./election-backend
      dockerfile: Dockerfile
    container_name: election-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: