
services:
  frontend:
    build: ./election-frontend
    container_name: election-frontend-prod
    restart: always
    ports:
      - "9000:8080"
  db:
    image: postgres:16
    container_name: election-postgres
    restart: always
    environment:
      POSTGRES_DB: electiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: